<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- 🔧 ชื่อที่โชว์บนแท็บเบราว์เซอร์ แก้ได้เลย -->
<title>กูมีเรื่องจะบอกมึง</title>

<!-- 🔧 ฟอนต์: ตอนนี้ใช้ "Mali"
     อยากเปลี่ยน → ไปเลือกที่ fonts.google.com แล้วคัดลอกลิงก์มาแทนบรรทัดนี้
     จากนั้นไปแก้ชื่อฟอนต์ใน style.css (หัวข้อ "ฟอนต์") ให้ตรงกัน
     ตัวอย่างฟอนต์ไทยน่ารัก: Mali, Itim, Sriracha, Prompt, Kanit -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">

<!-- เชื่อมไฟล์หน้าตา (CSS) -->
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =====================================================
  ไฟล์นี้คือ "โครงหน้า" เท่านั้น
  - หน้าตา/สี/animation  → แก้ที่ style.css
  - ข้อความ/ฉาก/ปุ่มทำงาน → แก้ที่ script.js
  หมายเหตุ: ข้อความหัวข้อ, คำอธิบาย, ชื่อปุ่ม จะถูก JS ใส่ให้
  (ช่องว่างด้านล่างนี้ว่างไว้ตั้งใจ) ไปแก้ใน script.js
====================================================== -->

<main class="card">

  <!-- 🔧 ข้อความตัวเล็กบนสุดของการ์ด -->
  <div class="tag">ประกาศจากหมา</div>

  <!-- กรอบใส่ตัวการ์ตูน -->
  <div class="stage">

    <!-- ===== ตัวการ์ตูน "หมากวน" วาดด้วย SVG =====
         viewBox="0 0 200 190" = ผ้าใบกว้าง 200 สูง 190 (พิกัดทั้งหมดอิงตัวเลขนี้)
         data-mood="smug" = สีหน้าเริ่มต้น (JS เปลี่ยนให้เอง)
         💡 ใช้รูปตัวเอง: ลบก้อน svg ทั้งหมดตั้งแต่เปิดถึงปิด แล้วใส่
            <img src="my-pic.png" style="width:100%;height:190px;object-fit:contain"> -->
    <svg id="mochi" viewBox="0 0 200 190" data-mood="smug" aria-label="หมากวน">

      <!-- 🔧 หูตก 2 ข้าง (สีน้ำตาล) เปลี่ยนสีที่ fill="#b9855a"
           rotate(20 ...) = เอียงกี่องศา เปลี่ยนเลข 20 ให้หูตกมากขึ้น/น้อยลง -->
      <ellipse cx="42"  cy="88" rx="20" ry="40" fill="#b9855a" stroke="#6b4a55" stroke-width="3" transform="rotate(18 42 88)"/>
      <ellipse cx="158" cy="88" rx="20" ry="40" fill="#b9855a" stroke="#6b4a55" stroke-width="3" transform="rotate(-18 158 88)"/>

      <!-- 🔧 หัวหมา: fill = สีขน (#f6e3c8 = ครีม) ลอง #ffffff ขาว หรือ #d9a066 น้ำตาลอ่อน -->
      <ellipse cx="100" cy="108" rx="66" ry="60" fill="#f6e3c8" stroke="#6b4a55" stroke-width="3"/>

      <!-- 🔧 ปื้นสีน้ำตาลรอบตาขวา (ลายหมา) ไม่ชอบก็ลบบรรทัดนี้ -->
      <ellipse cx="128" cy="98" rx="24" ry="22" fill="#b9855a" opacity=".85"/>

      <!-- ปากสีขาว (ที่ครอบจมูก+ปาก) -->
      <ellipse cx="100" cy="140" rx="32" ry="24" fill="#fff" stroke="#6b4a55" stroke-width="2.5"/>

      <!-- 🔧 แก้มชมพู -->
      <ellipse cx="52"  cy="128" rx="11" ry="7" fill="#fbb6c9" opacity=".8"/>
      <ellipse cx="148" cy="128" rx="11" ry="7" fill="#fbb6c9" opacity=".8"/>

      <!-- จมูก -->
      <ellipse cx="100" cy="126" rx="10" ry="7" fill="#4a3039"/>
      <ellipse cx="97"  cy="124" rx="3"  ry="2" fill="#fff" opacity=".6"/>

      <!-- ===== สีหน้า 5 แบบ =====
           แต่ละ <g class="m-xxx"> คือหนึ่งอารมณ์ ซ่อนไว้หมด
           JS เลือกโชว์ตาม mood ของฉาก (ตั้งใน script.js)
           เพิ่มอารมณ์ใหม่: ดูวิธีท้ายไฟล์ script.js -->
      <g class="face">

        <!-- m-smug : หน้ากวนตีน (ตาปรือ คิ้วเลิกข้างนึง ยิ้มมุมปาก) -->
        <g class="m-smug">
          <path d="M60 104 h24 M116 104 h24" stroke="#4a3039" stroke-width="4" stroke-linecap="round"/>
          <path d="M62 106 q10 10 20 0 M118 106 q10 10 20 0" fill="#4a3039"/>
          <!-- 🔧 คิ้ว: ข้างขวายกสูงกว่า = หน้ากวน -->
          <path d="M60 90 l24 4" stroke="#4a3039" stroke-width="4" stroke-linecap="round"/>
          <path d="M116 80 l24 -6" stroke="#4a3039" stroke-width="4" stroke-linecap="round"/>
          <path d="M100 133 v6 M100 139 q-12 12 -22 2 M100 139 q14 6 24 -8" fill="none" stroke="#4a3039" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- m-cry : ร้องไห้ (ตาเล็ก ปากเบ้ น้ำตาไหล) -->
        <g class="m-cry">
          <circle cx="76"  cy="106" r="6" fill="#4a3039"/><circle cx="124" cy="106" r="6" fill="#4a3039"/>
          <circle cx="78"  cy="104" r="2" fill="#fff"/><circle cx="126" cy="104" r="2" fill="#fff"/>
          <path d="M62 92 l22 -6 M138 92 l-22 -6" stroke="#4a3039" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M100 133 v6 M86 150 q14 -12 28 0" fill="none" stroke="#4a3039" stroke-width="3" stroke-linecap="round"/>
          <!-- 🔧 น้ำตา: fill = สีน้ำตา -->
          <path class="tear"   d="M76 114 q-6 10 0 14 q6 -4 0 -14z" fill="#8fd3f4"/>
          <path class="tear b" d="M124 114 q-6 10 0 14 q6 -4 0 -14z" fill="#8fd3f4"/>
        </g>

        <!-- m-plead : อ้อนวอน (ตาโตวิบวับ คิ้วตก) -->
        <g class="m-plead">
          <circle cx="76"  cy="106" r="11" fill="#4a3039"/><circle cx="124" cy="106" r="11" fill="#4a3039"/>
          <circle cx="80"  cy="102" r="4.5" fill="#fff"/><circle cx="128" cy="102" r="4.5" fill="#fff"/>
          <circle cx="72"  cy="110" r="2" fill="#fff"/><circle cx="120" cy="110" r="2" fill="#fff"/>
          <path d="M62 88 l22 -8 M138 88 l-22 -8" stroke="#4a3039" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M100 133 v6 M90 148 q10 -7 20 0" fill="none" stroke="#4a3039" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- m-sob : สะอื้นหนัก (หลับตา อ้าปากกว้าง น้ำตาพุ่ง) -->
        <g class="m-sob">
          <path d="M62 106 l22 6 M138 106 l-22 6" stroke="#4a3039" stroke-width="4" stroke-linecap="round"/>
          <path d="M84 146 q16 -10 32 0 q-4 20 -16 20 q-12 0 -16 -20z" fill="#4a3039"/>
          <ellipse cx="100" cy="161" rx="9" ry="5" fill="#e8798f"/>
          <path class="tear"   d="M72 116 q-7 12 0 17 q7 -5 0 -17z" fill="#8fd3f4"/>
          <path class="tear b" d="M128 116 q-7 12 0 17 q7 -5 0 -17z" fill="#8fd3f4"/>
        </g>

        <!-- m-smile : แลบลิ้นแซว "ว่าแล้ว" (ใช้ฉากเฉลย) -->
        <g class="m-smile">
          <path d="M62 106 q10 -12 20 0 M118 106 q10 -12 20 0" fill="none" stroke="#4a3039" stroke-width="4" stroke-linecap="round"/>
          <path d="M100 133 v5 M84 142 q16 16 32 0" fill="none" stroke="#4a3039" stroke-width="3" stroke-linecap="round"/>
          <!-- ลิ้น 🔧 สีลิ้นที่ fill -->
          <path d="M92 150 q8 24 18 0z" fill="#ff8aa5" stroke="#4a3039" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M101 150 v10" stroke="#d9627f" stroke-width="2"/>
        </g>

      </g>
    </svg>
  </div>

  <!-- ช่องว่าง 3 อันนี้ JS จะเติมข้อความให้ (id ต้องตรงกับใน script.js ห้ามเปลี่ยน) -->
  <h1 id="title" class="fade"></h1>   <!-- หัวข้อ -->
  <p  id="text"  class="fade"></p>    <!-- คำอธิบาย -->

  <!-- ตัวนับจำนวนครั้งที่ปฏิเสธ (JS ใส่ข้อความให้ ซ่อนไว้ก่อนจนกว่าจะกดปฏิเสธครั้งแรก) -->
  <div id="counter" class="counter"></div>

  <div class="buttons">
    <button id="btnMain" class="primary"></button>  <!-- ปุ่ม "ยอม" (สีส้ม กว้าง 30%) -->
    <button id="btnAlt"  class="ghost"></button>    <!-- ปุ่ม "ไม่ยอม" (สีขาว กว้าง 70%) -->
  </div>

</main>

<!-- เชื่อมไฟล์สมองของเว็บ (JS) — ต้องอยู่ท้ายสุดของ body เสมอ -->
<script src="script.js"></script>
</body>
</html>
